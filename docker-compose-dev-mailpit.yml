services:

  #
  # Mailpit: catches all outgoing mail for local testing (web UI on :8025).
  # Point shanoir at it with SHANOIR_SMTP_HOST=<prefix>mailpit and
  # SHANOIR_SMTP_PORT=1025 in .env, then recreate the users container.
  #
  mailpit:
    container_name: "${SHANOIR_PREFIX}mailpit"
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    environment:
      MP_MAX_MESSAGES: 10000 # default is 500
      MP_SMTP_BIND_ADDR: ":1025"
    networks:
      - shanoir_ng_network

networks:
  shanoir_ng_network: