@if (loading) {
    <div class="chart-message"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
} @else if (!labels?.length) {
    <div class="chart-message">{{ emptyMessage }}</div>
} @else {
    <div class="chart-toolbar">
        <button type="button" class="chart-action-btn" title="Download as PNG" (click)="downloadPng()">
            <i class="fas fa-download"></i>
        </button>
    </div>
    <canvas baseChart type="bar" [data]="chartData" [options]="chartOptions"></canvas>
}
