<div class="block statistics">
    <div class="icon">
        <i class="fas fa-chart-line"></i>
        <div class="block-title">Statistics</div>
    </div>
    <div class="pannel">
        @if (loading) {
            <div class="statistics-message"><i class="fas fa-spinner fa-pulse"></i> Loading statistics...</div>
        } @else if (!hasData) {
            <div class="statistics-message">No data available yet.</div>
        } @else {
            <line-chart [labels]="labels" [datasets]="datasets" yAxisLabel="Cumulative count"></line-chart>
        }
    </div>
</div>
