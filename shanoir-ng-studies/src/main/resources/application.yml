######################################
# Default profile is production      #
######################################
server:
  port: 9902
##### Database #####
spring:
  cloud:
    aws:
      s3:
        endpoint: ${S3_ENDPOINT:http://ninja:9000}
        path-style-access-enabled: true
        region: ${S3_REGION:eu-west-1}
      credentials:
        access-key: ${S3_ACCESS_KEY_ID}
        secret-key: ${S3_SECRET_ACCESS_KEY}
  config:
    import: "classpath:/shanoir-shared.yml"
  datasource:
    url: jdbc:mariadb://${SHANOIR_DB_HOST:${SHANOIR_PREFIX}database}:${SHANOIR_DB_PORT:3306}/${SHANOIR_DB_NAME:studies}?characterEncoding=utf-8
    username: studies
    password: password
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    show-sql: false
    defer-datasource-initialization: true
    generate-ddl: false # default, but prefer to set it explicitly (bootstrap.sh)
    hibernate:
      # Hibernate ddl auto (create, create-drop, update, validate)
      ddl-auto: validate
      id:
        db_structure_naming_strategy: legacy
    open-in-view: false
    properties:
      hibernate:
        connection:
          charset: UTF-8
        hbm2ddl:
          import_files_sql_extractor: org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor
  main:
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  sql:
    init:
      data-locations: classpath:/scripts/import.sql
      mode: never
  threads:
    virtual:
      enabled: true
  ##### Others #####
  jackson:
    mapper:
      use-getters-as-setters: false
  jooq:
    sql-dialect: MariaDB
  rabbitmq:
    host: ${SHANOIR_PREFIX}rabbitmq
    port: 5672
    username: guest
    password: guest
    template:
      reply-timeout: 60000
  session:
    store-type: none
  servlet:
    multipart:
      enabled: true
      max-file-size: 6000MB
      max-request-size: 6000MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SHANOIR_KEYCLOAK_URL:localhost}/realms/shanoir-ng
          jwk-set-uri: ${SHANOIR_KEYCLOAK_INTERNAL_URL:http://keycloak:8080/auth}/realms/shanoir-ng/protocol/openid-connect/certs
  web:
    error:
      whitelabel:
        enabled: false

springdoc:
  api-docs:
    path: '/api-docs'
    enabled: true
  swagger-ui:
    url: /shanoir-ng/studies/api-docs
    config-url: /shanoir-ng/studies/api-docs/swagger-config
    enabled: true
    disable-swagger-default-url: true
    oauth:
      client-id: shanoir-swagger

front.server:
  address: ${SHANOIR_URL_SCHEME}://${SHANOIR_URL_HOST}/shanoir-ng/
  url: ${SHANOIR_URL_SCHEME}://${SHANOIR_URL_HOST}

storage:
  type: ${SHANOIR_STORAGE_TYPE:file-system} # "file-system" or "s3"
  file-system:
    studies-data: /var/studies-data
    # file-system only (by design, e.g. validator) and temporary data: no S3
    bids-data: /var/bids-data
    # file-system only: temporary data: no S3
    vip-data: /var/vip-data
  s3:
    studies:
      bucket: ${S3_BUCKET_STUDIES:studies}
      prefix: studies/

# logging configuration
logging:
  pattern:
    file: '%d{yyyy-MM-dd_HH:mm:ss.SSS} %-5level [%mdc{username}] %logger{35} - %msg%n'
  file:
    name: /var/log/shanoir-ng-logs/shanoir-ng-studies.log
  level:
    org.shanoir: INFO
    org.springframework.web: ERROR
    org.hibernate: ERROR

