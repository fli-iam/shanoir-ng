

######################################
# DO NOT COMMIT VALUES MODIFICATIONS #
######################################
server:
  port: 9913
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/import?useLegacyDatetimeCode=false&serverTimezone=Europe/Paris&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
  jpa:
    generate-ddl: true
    hibernate:
      # Hibernate ddl auto (create, create-drop, update, validate)
      ddl-auto: create
    show-sql: true
  rabbitmq:
    host: localhost
  main:
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  sql:
    init:
      mode: always
  threads:
    virtual:
      enabled: true
front.server:
  address: https://shanoir-ng-nginx/shanoir-ng/
  url: https://shanoir-ng-nginx
# logging configuration
logging:
  file:
    name: /var/log/shanoir-ng-logs/shanoir-ng-import.log
  level:
    org.springframework.web: DEBUG
    org.hibernate: DEBUG
    org.springframework.amqp: OFF
shanoir:
  import:
    directory: /tmp
    # Import from PACS configuration
    pacs:
      query:
        aet.calling:
          name: SHANOIR-SCU
          host: localhost
          port: 11115
        aet.called:
          name: DCM4CHEE
          host: localhost
          port: 11112
        maxPatients: 10
      store:
        aet.called:
          name: SHANOIR-SCP
          host: localhost
          port: 44125
        folder: /tmp/shanoir-dcmrcv

