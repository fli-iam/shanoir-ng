######################################
# Default profile is production      #
######################################
server:
  port: 9903
##### Database #####
spring:
  config:
    import: "classpath:/shanoir-shared.yml"
  datasource:
    url: jdbc:mariadb://${SHANOIR_DB_HOST:${SHANOIR_PREFIX}database}:${SHANOIR_DB_PORT:3306}/${SHANOIR_DB_NAME:import}?characterEncoding=utf-8
    username: import
    password: password
    driver-class-name: org.mariadb.jdbc.Driver
    hikari.maximum-pool-size: 50
    hikari.minimum-idle: 50
  jpa:
    defer-datasource-initialization: true
    generate-ddl: false # default, but prefer to set it explicitly (bootstrap.sh)
    hibernate:
      # Hibernate ddl auto (create, create-drop, update, validate)
      ddl-auto: validate
      id:
        db_structure_naming_strategy: legacy
    open-in-view: false
    properties:
      hibernate:
        connection:
          charset: UTF-8
        hbm2ddl:
          import_files_sql_extractor: org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor
  main:
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  sql:
    init:
      data-locations: classpath:/scripts/import.sql
      mode: never
  threads:
    virtual:
      enabled: true
  ##### Others #####
  jackson:
    mapper:
      use-getters-as-setters: false
  jooq:
    sql-dialect: MariaDB
  rabbitmq:
    host: ${SHANOIR_PREFIX}rabbitmq
    port: 5672
    username: guest
    password: guest
  session:
    store-type: none
  servlet:
    multipart:
      enabled: true
      max-file-size: 5000MB
      max-request-size: 5000MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SHANOIR_KEYCLOAK_URL}/realms/shanoir-ng
          jwk-set-uri: ${SHANOIR_KEYCLOAK_INTERNAL_URL:http://keycloak:8080/auth}/realms/shanoir-ng/protocol/openid-connect/certs
  web:
    error:
      whitelabel:
        enabled: false
springdoc:
  api-docs:
    path: '/api-docs'
    enabled: true
  swagger-ui:
    url: /shanoir-ng/import/api-docs
    config-url: /shanoir-ng/import/api-docs/swagger-config
    enabled: true
    disable-swagger-default-url: true

front.server:
  address: ${SHANOIR_URL_SCHEME}://${SHANOIR_URL_HOST}/shanoir-ng/
  url: ${SHANOIR_URL_SCHEME}://${SHANOIR_URL_HOST}

# logging configuration
logging:
  pattern:
    file: '%d{yyyy-MM-dd_HH:mm:ss.SSS} %-5level [%mdc{username}] %logger{35} - %msg%n'
  file:
    name: /var/log/shanoir-ng-logs/shanoir-ng-import.log
  level:
    org.springframework.web: ERROR
    org.hibernate: ERROR
    org.shanoir: INFO
# Shanoir configurations
shanoir:
  import:
    directory: /tmp
    # Import from PACS configuration
    pacs:
      query:
        aet.calling:
          name: SHANOIR-SCU
          host: "0.0.0.0"
          #host: ${SHANOIR_PREFIX}import
          port: 11115
        aet.called:
          name: DCM4CHEE
          host: ${SHANOIR_PREFIX}dcm4chee-arc
          port: 11112
        maxPatients: 10
      store:
        aet.called:
          name: SHANOIR-SCP
          host: "0.0.0.0"
          #host: ${SHANOIR_PREFIX}import
          port: 44105
        folder: /tmp/shanoir-dcmrcv

