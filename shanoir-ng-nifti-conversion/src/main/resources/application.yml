######################################
# Default profile is production      #
######################################
server:
  port: 9903
##### Database #####
spring:
  config:
    import: "classpath:/shanoir-shared.yml"
  jackson:
    mapper:
      use-getters-as-setters: false
  rabbitmq:
    host: ${SHANOIR_PREFIX}rabbitmq
    port: 5672
    username: guest
    password: guest
  session:
    store-type: none
  servlet:
    multipart:
      enabled: true
      max-file-size: 5000MB
      max-request-size: 5000MB
  web:
    error:
      whitelabel:
        enabled: false

# logging configuration
logging:
  file:
    name: /var/log/shanoir-ng-logs/shanoir-ng-nifti-conversion.log
  level:
    org.springframework.web: ERROR
    org.shanoir: INFO
shanoir:
  database: disable
  conversion:
    converters:
      mriconverter: "/opt/nifti-converters/mriconverter/MRIFileManager/MRIManager.jar"
