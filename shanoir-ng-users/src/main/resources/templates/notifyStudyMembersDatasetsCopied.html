<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
    <p>Dear <span th:text="${firstname}"></span> <span th:text="${lastname}"></span>, <br/>
    User <span th:text="${username}"></span> copied <span th:text="${datasetCount}"></span> dataset(s) to study
    <a th:href="${studyAddress}" th:text="${studyName}"></a>.</p>
    <p th:if="${examinations != null and !#lists.isEmpty(examinations)}"> Examinations: <br/>
    <ul>
    <li th:each="exam : ${examinations}"><a th:href="${exam.url}" th:text="${exam.name}"></a></li>
    <li th:if="${moreExaminations > 0}" th:text="${'... and ' + moreExaminations + ' more'}"></li>
    </ul>
    </p>
    <p>Regards,<br/>
    Shanoir administrator</p>
</body>
</html>
