# Create a Docker image for each microservice in Shanoir
name: Publish Native Docker images

env:
  DOCKER_REPOSITORY: ghcr.io/${{ github.repository }}
  GIT_REPO_URL: https://github.com/${{ github.repository }}

  # production builds
  # - triggered by pushing a tag
  # - builds the current commit
  # - cache is disabled
  # development builds
  # - triggered by workflow_call (in the deploy-qualif workflow)
  # - builds the commit provided in the 'sha' input variable
  # - cache is enabled
  PRODUCTION: ${{ github.event_name == 'push' && '1' || '' }}

  # id of the git commit to be built
  SHA: ${{ github.event_name == 'push' && github.sha || inputs.sha }}

  # tag of the resulting docker image
  # - name of the git tag (production builds)
  # - commit id (develpment builds)
  IMAGE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.sha }}

  # boolean: force rebuilding the docker images from scratch
  NO_CACHE: ${{ inputs.no_cache && '1' || '' }}

on:
  push:
    tags:
      - '*'
  workflow_call:
    inputs:
      sha:
        description: 'git commit to be built'
        type: string
        required: true
      no_cache:
        description: 'force rebuilding the docker images from scratch'
        type: boolean
        default: false

jobs:
  #
  # Native image creation for all microservices (start with users), built via
  # spring-boot-maven-plugin's build-image goal (Cloud Native Buildpacks /
  # Paketo), instead of a Dockerfile + buildx bake like build_images above.
  #
  # GitHub-hosted ubuntu-latest runners already have a Docker daemon
  # available on the default socket, which is all build-image needs -
  # no docker-in-docker or buildx setup required here.
  build_native_images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    # native-image compilation is heavier/slower (~12 min); kept separate
    # from build_images' 15-minute timeout since it's a different job
    timeout-minutes: 25
    steps:

      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRODUCTION && github.repository || 'fli-iam/shanoir-ng' }}
          ref: ${{ env.IMAGE_TAG }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Create directory /shanoir-ng-logs
        run: sudo mkdir -m777 /var/log/shanoir-ng-logs
      
      # maven cache only enabled on development builds
      - name: Set up Maven cache
        uses: actions/cache@v4
        if: "${{ ! env.PRODUCTION }}"
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REPOSITORY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Build dependencies of users-native below to be found
      - name: Maven build
        run: mvn -f ./shanoir-ng-parent/pom.xml install -DskipTests
        
      # Produces a local image "shanoir-ng-users-native:latest" on the
      # runner's own docker daemon, per the plugin's
      # <image><name>${project.name}-native</name></image> configuration.
      - name: Build users-native image (buildpacks)
        run: >
          mvn -f ./shanoir-ng-users/pom.xml -Pnative spring-boot:build-image -DskipTests

      - name: Tag and push users-native image
        run: |
          set -e

          # Same "is this the main branch" check as build_images, so the
          # native image gets a "develop" tag under the same conditions.
          MAIN_BRANCH_SHA=$(curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            "${{ github.api_url }}/repos/fli-iam/shanoir-ng/branches/develop" \
            | jq -r '.commit.sha // empty')

          IS_MAIN_BRANCH=false
          if [ -n "$MAIN_BRANCH_SHA" ] && [ "$MAIN_BRANCH_SHA" = "$IMAGE_TAG" ] && [ "$IMAGE_TAG" = "$SHA" ]; then
            IS_MAIN_BRANCH=true
          fi

          LOCAL_IMAGE="shanoir-ng-users-native:latest"
          REMOTE_BASE="${DOCKER_REPOSITORY}/users-native"

          docker tag "$LOCAL_IMAGE" "${REMOTE_BASE}:${IMAGE_TAG}"
          docker push "${REMOTE_BASE}:${IMAGE_TAG}"

          if [ "$IS_MAIN_BRANCH" = "true" ]; then
            docker tag "$LOCAL_IMAGE" "${REMOTE_BASE}:develop"
            docker push "${REMOTE_BASE}:develop"
          fi
