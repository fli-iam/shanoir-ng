name: Renumber db changes scripts

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

permissions:
  contents: write

concurrency:
  group: renumber-database-migrations
  cancel-in-progress: false

jobs:
  renumber:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Renumber migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: python3 .github/workflows/scripts/renumber-migrations.py

      - name: Commit renamed migrations
        run: |
          if git diff --quiet; then
              echo "No migration to rename"
              exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Renumber database migrations"
          git push origin develop
