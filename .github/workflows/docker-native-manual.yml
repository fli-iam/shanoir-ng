# Build a native Docker image (Cloud Native Buildpacks / Paketo, via
# spring-boot-maven-plugin's build-image goal) for ONE selected microservice
# and publish it to ghcr.io. Triggered manually from the "Actions" tab.
#
# The code that is built is the branch/tag chosen in the
# "Use workflow from" drop-down when clicking "Run workflow".
name: Publish Native Docker image (manual)

env:
  DOCKER_REPOSITORY: ghcr.io/${{ github.repository }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Microservice to build natively'
        type: choice
        required: true
        default: users
        options:
          - users
          - studies
          - import
          - preclinical
          - nifti-conversion
          # - datasets   # TODO: add once shanoir-ng-datasets is migrated
      push_image:
        description: 'Push the image to ghcr.io (uncheck to only test the build)'
        type: boolean
        default: true
      no_cache:
        description: 'Disable the Maven cache'
        type: boolean
        default: false

jobs:
  build_native_image:
    name: Native image - ${{ inputs.service }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    # native-image compilation is heavy/slow (~12 min for users)
    timeout-minutes: 25
    env:
      SERVICE: ${{ inputs.service }}
      MODULE_DIR: shanoir-ng-${{ inputs.service }}
    steps:

      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Check that the module exists
        run: |
          if [ ! -f "${MODULE_DIR}/pom.xml" ]; then
            echo "::error::${MODULE_DIR}/pom.xml not found on ref ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Create directory /shanoir-ng-logs
        run: sudo mkdir -m777 /var/log/shanoir-ng-logs

      - name: Set up Maven cache
        uses: actions/cache@v4
        if: ${{ !inputs.no_cache }}
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Login to GitHub Container Registry
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the dependencies of the selected module so that they are found
      - name: Maven build (parent + dependencies)
        run: mvn -f ./shanoir-ng-parent/pom.xml install -DskipTests

      # Produces a local image on the runner's docker daemon, named by the
      # plugin's <image><name>${project.name}-native</name></image> configuration.
      - name: Build native image (buildpacks)
        run: mvn -f "./${MODULE_DIR}/pom.xml" -Pnative spring-boot:build-image -DskipTests

      - name: Tag and push image
        env:
          PUSH_IMAGE: ${{ inputs.push_image }}
        run: |
          set -euo pipefail

          # Local image name, as configured in the module's pom
          PROJECT_NAME=$(mvn -f "./${MODULE_DIR}/pom.xml" -Pnative -q -N \
            help:evaluate -Dexpression=project.name -DforceStdout)
          LOCAL_IMAGE="${PROJECT_NAME}-native:latest"

          if ! docker image inspect "$LOCAL_IMAGE" > /dev/null 2>&1; then
            echo "::error::Local image '$LOCAL_IMAGE' not found. Images present:"
            docker image ls
            exit 1
          fi

          # Docker repository names must be lowercase
          REMOTE_BASE="$(echo "${DOCKER_REPOSITORY}/${SERVICE}-native" | tr '[:upper:]' '[:lower:]')"

          # Tags: sanitized ref name (e.g. feature/foo -> feature-foo) + short commit id
          REF_TAG=$(echo "${GITHUB_REF_NAME}" | sed 's#[^A-Za-z0-9_.-]#-#g')
          SHORT_SHA="${GITHUB_SHA::7}"

          TAGS="${REF_TAG} ${SHORT_SHA}"
          # Same convention as the regular images: "develop" tag for the develop branch
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            TAGS="${TAGS} develop"
          fi
          TAGS=$(echo "$TAGS" | tr ' ' '\n' | sort -u)

          for TAG in $TAGS; do
            docker tag "$LOCAL_IMAGE" "${REMOTE_BASE}:${TAG}"
            if [ "${PUSH_IMAGE}" = "true" ]; then
              docker push "${REMOTE_BASE}:${TAG}"
            fi
          done

          {
            echo "### Native image for \`${SERVICE}\`"
            echo "- Built from: \`${GITHUB_REF_NAME}\` (\`${SHORT_SHA}\`)"
            if [ "${PUSH_IMAGE}" = "true" ]; then
              echo "- Pushed tags:"
              for TAG in $TAGS; do echo "  - \`${REMOTE_BASE}:${TAG}\`"; done
            else
              echo "- Push skipped (\`push_image\` unchecked)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
