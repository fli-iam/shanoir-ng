# Create a Docker image for each microservice in Shanoir
name: Publish Docker images

env:
  DOCKER_REPOSITORY: ghcr.io/${{ github.repository }}
  GIT_REPO_URL: https://github.com/${{ github.repository }}

  # production builds
  # - triggered by pushing a tag
  # - builds the current commit
  # - cache is disabled
  # development builds
  # - triggered by workflow_call (in the deploy-qualif workflow)
  # - builds the commit provided in the 'sha' input variable
  # - cache is enabled
  PRODUCTION: ${{ github.event_name == 'push' && '1' || '' }}

  # id of the git commit to be built
  SHA: ${{ github.event_name == 'push' && github.sha || inputs.sha }}

  # tag of the resulting docker image
  # - name of the git tag (production builds)
  # - commit id (develpment builds)
  IMAGE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.sha }}

  # boolean: force rebuilding the docker images from scratch
  NO_CACHE: ${{ inputs.no_cache && '1' || '' }}

  # Required secrets of docker-compose-dev.yml: compose refuses to parse the file when they
  # are empty. They are runtime variables, not build arguments, so these placeholders never
  # reach the images.
  SHANOIR_KEYCLOAK_PASSWORD: ci-build-only
  VIP_CLIENT_SECRET: ci-build-only
  NEUROBAGEL_CLIENT_SECRET: ci-build-only
  SHANOIR_PACS_DATABASE_PASSWORD: ci-build-only
  SHANOIR_PACS_LDAP_ROOT_PASSWORD: ci-build-only
  SHANOIR_PACS_LDAP_CONFIG_PASSWORD: ci-build-only
  SHANOIR_DB_ROOT_PASSWORD: ci-build-only
  SHANOIR_USERS_DB_PASSWORD: ci-build-only
  SHANOIR_STUDIES_DB_PASSWORD: ci-build-only
  SHANOIR_IMPORT_DB_PASSWORD: ci-build-only
  SHANOIR_DATASETS_DB_PASSWORD: ci-build-only
  SHANOIR_PRECLINICAL_DB_PASSWORD: ci-build-only
  SHANOIR_MIGRATIONS_DB_PASSWORD: ci-build-only
  SHANOIR_KEYCLOAK_DB_ROOT_PASSWORD: ci-build-only
  SHANOIR_KEYCLOAK_DB_PASSWORD: ci-build-only
  SHANOIR_RABBITMQ_PASSWORD: ci-build-only

on:
  push:
    tags:
      - '*'
  workflow_call:
    inputs:
      sha:
        description: 'git commit to be built'
        type: string
        required: true
      no_cache:
        description: 'force rebuilding the docker images from scratch'
        type: boolean
        default: false

jobs:
  build_images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    # mitigation for the random freezes when pushing images (see #2992)
    timeout-minutes: 30
    steps:

      # mitigation for "no space left on device" errors: the runner's default
      # ~14GB of free disk space is not enough to build all the shanoir-ng
      # docker images
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # not removed by default: the maven build below does not rely on
          # the runner's preinstalled tool cache (Node, Python, Go, ...)
          tool-cache: true

      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRODUCTION && github.repository || 'fli-iam/shanoir-ng' }}
          ref: ${{ env.IMAGE_TAG }}

      # .env is not tracked by git (older commits still track it and have no .env.example)
      - name: Create .env from .env.example
        run: if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Create directory /shanoir-ng-logs
        run: sudo mkdir -m777 /var/log/shanoir-ng-logs

      # maven cache only enabled on development builds
      - name: Set up Maven cache
        uses: actions/cache@v4
        if: "${{ ! env.production }}"
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REPOSITORY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate the docker bake config
        shell: python
        run: |
          import json, os, pathlib, re, requests, subprocess
          env = os.environ

          # query the sha of the head of the main branch
          MAIN_REPO, MAIN_BRANCH = "fli-iam/shanoir-ng", "develop"
          main_branch_sha = requests.get(
              f"${{ github.api_url }}/repos/{MAIN_REPO}/branches/{MAIN_BRANCH}",
              headers={"Authorization": "Bearer ${{ github.token }}"},
            ).json().get("commit", {}).get("sha")

          # cache configuration
          #
          # We do not use 'type=gha' because the github actions cache is not
          # able to reliably reuse an existing cache for all images in every
          # build, thus rendering the cache ineffective (this is probably
          # caused by the size limits).
          #
          # Instead we explicitely store the cache in container repository of
          # the project ('type=registry'), under the tag 'cache'
          # - we pull the cache (cache_from) before development builds of any
          #   branch when inputs.no_cache is false
          # - we push the cache (cache_to) after development builds of the
          #   main branch only
          # - we never use the cache on production builds
          #
          # The image is exported in the OCI format ('image-manifest=true')
          # to avoid a "failed to solve: not found" error when pushing to the
          # github container registry.
          is_main_branch = (main_branch_sha == env['IMAGE_TAG'] == env['SHA'])
          enable_cache_from = not env['PRODUCTION'] and not env['NO_CACHE']
          enable_cache_to   = not env['PRODUCTION'] and is_main_branch
          print(f"{enable_cache_from = }\n{enable_cache_to = }\n")

          def cache_arg(enabled: bool, image: str, extra=""):
            return [f"type=registry,image-manifest=true,ref={env['DOCKER_REPOSITORY']}/{image}:cache{extra}"
                   ] if enabled else []

          # 'latest' follows the highest NG_vX.Y.Z release, compared by version
          # number and not by date: a patch of an older line (e.g. NG_v2.14.2
          # after NG_v2.15.0) must not move it back. Other tags (SHUP_v*, ...)
          # never move it.
          def release_version(tag: str):
              m = re.fullmatch(r"NG_v(\d+)\.(\d+)\.(\d+)", tag)
              return tuple(map(int, m.groups())) if m else None

          is_latest_release = False
          if env['PRODUCTION'] and release_version(env['IMAGE_TAG']):
              remote_tags = subprocess.check_output(
                  ["git", "ls-remote", "--tags", "--refs", env['GIT_REPO_URL']], text=True)
              versions = [v for v in (release_version(line.rsplit("/", 1)[-1])
                                      for line in remote_tags.splitlines()) if v]
              is_latest_release = release_version(env['IMAGE_TAG']) >= max(versions)
          print(f"{is_latest_release = }\n")

          # - use $IMAGE_TAG for resulting docker image tag
          # - add a second tag 'develop' when building the main branch
          # - add a second tag 'latest' when building the highest release
          def tags(image: str):
              extra = ((MAIN_BRANCH,) if is_main_branch else ()) + (
                       ("latest",) if is_latest_release else ())
              return [f"{env['DOCKER_REPOSITORY']}/{image}:{t}"
                      for t in (env['IMAGE_TAG'],) + extra]
  
          # extract the list of images to be built from the docker-compose config
          images = json.loads(subprocess.check_output(
                  ["docker", "buildx", "bake", "--print", "-f", "docker-compose-dev.yml"])
              )["group"]["default"]["targets"]

          # override the bake config (add cache config + set tags & labels)
          pathlib.Path("docker-bake.json").write_text(json.dumps({
            #"group": { "default": { "targets": ["database"] }}, # TODO: remove
            "target": {
              image: {
                "cache-from": cache_arg(enable_cache_from, image),
                "cache-to":   cache_arg(enable_cache_to,   image, ",mode=max"),
                "tags": tags(image),
                "labels": {
                  "org.opencontainers.image.url":      env['GIT_REPO_URL'],
                  "org.opencontainers.image.source":   env['GIT_REPO_URL'],
                  "org.opencontainers.image.version":  env['IMAGE_TAG'],
                  "org.opencontainers.image.revision": env['SHA'],
                },
                } for image in images }}))

      - name: Maven build
        run: mvn -f ./shanoir-ng-parent/pom.xml install -DskipTests

      - name: Build docker images
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            docker-compose-dev.yml
            docker-bake.json
          provenance: mode=min  # production builds fail in the default mode (max)
          push: true
