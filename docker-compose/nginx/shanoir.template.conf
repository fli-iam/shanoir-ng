

# Request bodies are limited to 20 MB (JSON). Only the upload locations below accept large files.
# They stream the body to the service (proxy_request_buffering off) instead of writing it to disk
# first, so the service checks the authentication before receiving it.
client_max_body_size 20M;

# needed to import large datasets
proxy_read_timeout 	5000s;

# increase the buffer size (the default 4kb is occasionally too small for keycloak)
proxy_buffer_size	8k;

# do not buffer whole responses
proxy_buffering 	off;

proxy_set_header	Host $http_host;
# NOTE: X-Forward-For/X-Forwarded-Proto are added by the entrypoint

#
# API-Gateway for Shanoir-NG (microservices)
#
# forward each subdirectory to the relevant microservice
location /shanoir-ng/users/		{
	proxy_pass http://SHANOIR_USERS_HOST:9901/;
	# protect last login date update interface from outside access
	location = /shanoir-ng/users/last_login_date {
		return 404;
	}
}
location /shanoir-ng/studies/	{
	proxy_pass http://SHANOIR_STUDIES_HOST:9902/;

	# uploads: protocol files and DUA (PDF, 50 MB at most)
	location /shanoir-ng/studies/studies/protocol-file-upload/ {
		client_max_body_size 500M;
		proxy_request_buffering off;
		proxy_pass http://SHANOIR_STUDIES_HOST:9902/studies/protocol-file-upload/;
	}
	location /shanoir-ng/studies/studies/dua-upload/ {
		client_max_body_size 50M;
		proxy_request_buffering off;
		proxy_pass http://SHANOIR_STUDIES_HOST:9902/studies/dua-upload/;
	}
}
# uploads: DICOM, EEG, BIDS and processed dataset imports, VIP execution results
location /shanoir-ng/import/	{
	client_max_body_size 5000M;
	proxy_request_buffering off;
	proxy_pass http://SHANOIR_IMPORT_HOST:9903/;
}
location /shanoir-ng/dicomweb/	{ proxy_pass http://SHANOIR_IMPORT_HOST:9903/;	}
location /shanoir-ng/datasets/	{
	proxy_pass http://SHANOIR_DATASETS_HOST:9904/;

	# uploads: DICOM (STOW-RS, from ShanoirUploader), extra data of examinations and acquisitions
	location /shanoir-ng/datasets/dicomweb/studies {
		client_max_body_size 5000M;
		proxy_request_buffering off;
		proxy_pass http://SHANOIR_DATASETS_HOST:9904/dicomweb/studies;
	}
	location /shanoir-ng/datasets/examinations {
		client_max_body_size 5000M;
		proxy_request_buffering off;
		proxy_pass http://SHANOIR_DATASETS_HOST:9904/examinations;
	}
	location /shanoir-ng/datasets/datasetacquisition/ {
		client_max_body_size 5000M;
		proxy_request_buffering off;
		proxy_pass http://SHANOIR_DATASETS_HOST:9904/datasetacquisition/;
	}
}
location /shanoir-ng/preclinical/ {
	proxy_pass http://SHANOIR_PRECLINICAL_HOST:9905/;

	# uploads: Bruker archives, extra data of examinations, specifications of pathology models
	location /shanoir-ng/preclinical/bruker/upload {
		client_max_body_size 5000M;
		proxy_request_buffering off;
		proxy_pass http://SHANOIR_PRECLINICAL_HOST:9905/bruker/upload;
	}
	location /shanoir-ng/preclinical/examination/extradata/upload/ {
		client_max_body_size 5000M;
		proxy_request_buffering off;
		proxy_pass http://SHANOIR_PRECLINICAL_HOST:9905/examination/extradata/upload/;
	}
	location /shanoir-ng/preclinical/pathology/model/upload/specs/ {
		client_max_body_size 500M;
		proxy_request_buffering off;
		proxy_pass http://SHANOIR_PRECLINICAL_HOST:9905/pathology/model/upload/specs/;
	}
}
